name: Prueba AirDrop Android sin root
on:
  workflow_dispatch:
  push:
    branches: [experiment/airdrop-rootless]
    paths:
      - 'experiments/rootless-airdrop/**'
      - '.github/workflows/android-airdrop-probe.yml'
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'
      - name: Comprobar interpretación de evidencia
        working-directory: experiments/rootless-airdrop
        run: |
          mkdir -p build/tests
          javac -d build/tests app/src/main/java/com/example/lanlink/airdropprobe/AirDropEvidence.java tests/EvidenceTest.java
          java -cp build/tests EvidenceTest
      - name: Compilar APK normal de prueba
        working-directory: experiments/rootless-airdrop
        run: gradle :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: LanLink-AirDrop-Rootless-Probe
          path: experiments/rootless-airdrop/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
