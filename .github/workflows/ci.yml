name: Verificar LanLink

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: python3 -m unittest discover -s tests -v

  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            runner: ubuntu-latest
          - target: linux
            runner: ubuntu-latest
          - target: windows
            runner: windows-latest
          - target: macos
            runner: macos-latest
          - target: ios
            runner: macos-latest
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: '3.47.7'
          channel: stable
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libsecret-1-dev
      - run: flutter pub get
      - if: matrix.target == 'android'
        run: flutter build apk --debug
      - if: matrix.target == 'android'
        uses: actions/upload-artifact@v4
        with:
          name: lanlink-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
      - if: matrix.target == 'linux'
        run: flutter build linux --release
      - if: matrix.target == 'linux'
        uses: actions/upload-artifact@v4
        with:
          name: LanLink-Linux-x64
          path: build/linux/x64/release/bundle
          retention-days: 14
      - if: matrix.target == 'windows'
        run: flutter test
      - if: matrix.target == 'windows'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - if: matrix.target == 'windows'
        run: flutter build windows --debug
      - if: matrix.target == 'windows'
        shell: pwsh
        run: ./scripts/package_windows_share.ps1 -Release build/windows/x64/runner/Debug
      - if: matrix.target == 'macos'
        run: bash scripts/check_apple_crypto.sh
      - if: matrix.target == 'macos'
        run: |
          flutter build macos --debug --config-only
          xcodebuild -workspace macos/Runner.xcworkspace -scheme Runner -configuration Debug CODE_SIGNING_ALLOWED=NO build -quiet
      - if: matrix.target == 'ios'
        run: flutter build ios --simulator --debug --no-codesign
